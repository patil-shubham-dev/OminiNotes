<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="OmniNotes AI - Convert any image into structured notes and PDFs" />
    <title>OmniNotes AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#1a1a2e',
              secondary: '#16213e',
              accent: '#e94560',
              accentHover: '#d63d56',
              surface: '#0f3460',
              muted: '#533483',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      * { scrollbar-width: thin; scrollbar-color: #e94560 #1a1a2e; }
      *::-webkit-scrollbar { width: 6px; }
      *::-webkit-scrollbar-track { background: #1a1a2e; }
      *::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; }
      .gradient-text { background: linear-gradient(135deg, #e94560 0%, #533483 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .glass { background: rgba(26, 26, 46, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
      .glow { box-shadow: 0 0 40px rgba(233, 69, 96, 0.15); }
      .drop-active { border-color: #e94560 !important; background: rgba(233, 69, 96, 0.05) !important; }
      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      .pulse-ring::before {
        content: ''; position: absolute; inset: -4px; border-radius: inherit;
        border: 2px solid #e94560; animation: pulse-ring 2s ease-out infinite;
      }
      .typing-cursor::after {
        content: '|'; animation: blink 1s step-end infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run OmniNotes AI.</noscript>
    <div id="root"></div>
  </body>
</html>
